[package]
name = "tauri-app-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
dioxus-logger = "0.7.10"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Element", "MouseEvent", "console"] }
js-sys = "0.3.105"
serde-wasm-bindgen = "0.6.5"
#gloo-console = "0.4.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["wasmbind"] }
parser = { path = "parser"}

[workspace]
members = ["src-tauri", "parser"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true